<!DOCTYPE html>
<html lang="es" dir="ltr">

<head>
  <meta charset="utf-8">
  <!-- `viewport-fit=cover` es lo que hace que `env(safe-area-inset-*)` deje de
       valer cero en los teléfonos con notch. Sin él, la barra inferior de
       navegación queda debajo de la raya del gesto y no se puede pulsar.
       Lo aprovecha responsive.css; en el resto de teléfonos no cambia nada. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>Jesús Seiler | Sistemas de gestión, desarrollo y sitios web</title>
  <meta name="description" content="Auditor interno ISO y desarrollador. Sistemas de gestión multinorma, automatización y sitios web. Puerto Montt, Chile.">
  <meta name="author" content="Jesús Seiler">
  <link rel="canonical" href="https://seiler18.github.io/">
  <!-- Pinta la barra del navegador en Android. Sin él sale gris claro y rompe
       el tema oscuro nada más abrir. Mismo valor que --bg en tokens.css. -->
  <meta name="theme-color" content="#05070f">

  <link rel="icon" type="image/webp" href="/assets/favicon-Sd3r2YJv.webp">

  <!-- ============================================================
       SEGURIDAD DEL DOCUMENTO

       GitHub Pages sirve archivos estáticos y NO deja poner cabeceras HTTP,
       así que lo único que se puede endurecer va en <meta>. Tres avisos para
       quien lo toque:

       · `frame-ancestors` y `X-Frame-Options` se IGNORAN en <meta>: solo
         valen como cabecera HTTP. No los añadas aquí creyendo que protegen.
       · `script-src` es solo 'self', sin 'unsafe-inline' ni CDN: es lo que
         convierte cualquier HTML inyectado en inofensivo, porque un atributo
         `onerror` o una etiqueta script colada ya no se ejecutan. Se puede
         porque Vite 8 no escribe ningún script en línea (ni en el build ni en
         `npm run dev`: el polyfill de modulepreload va DENTRO del chunk de
         entrada), el JSON-LD es un bloque de datos que la CSP no trata como
         script, y Font Awesome es una hoja de estilo, no un script. Si algún
         día hace falta un script en línea, `npm run check` (punto 17) lo
         para: en producción moriría en silencio.
         `style-src` sí necesita 'unsafe-inline': en `npm run dev` Vite
         inyecta el CSS como <style>, y los estilos en atributo `style=` son
         la forma natural de pasar una variable CSS desde un componente.
       · Al añadir CUALQUIER servicio externo (analítica, mapa, tipografía,
         vídeo, formulario), su dominio tiene que entrar en la directiva que
         corresponda. Un dominio que falta no da más señal que una línea roja
         en la consola: el widget simplemente no aparece.
         → Ver referencia/seguridad.md de WebMaker.
       ============================================================ -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data:; connect-src 'self' https://formsubmit.co; form-action 'self' https://formsubmit.co; upgrade-insecure-requests">
  <!-- Al salir a un enlace externo se manda el origen, nunca la ruta completa. -->
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <!-- Redes sociales. og:image debe ser una URL ABSOLUTA: las relativas no
       las resuelve ni WhatsApp ni LinkedIn y la tarjeta sale sin imagen. -->
  <meta property="og:type" content="website">
  <meta property="og:locale" content="es_CL">
  <meta property="og:site_name" content="Jesús Seiler">
  <meta property="og:title" content="Jesús Seiler | Sistemas de gestión, desarrollo y sitios web">
  <meta property="og:description" content="Auditor interno ISO y desarrollador. Sistemas de gestión multinorma, automatización y sitios web. Puerto Montt, Chile.">
  <meta property="og:url" content="https://seiler18.github.io/">
  <!-- Sin `twitter:card`, X y LinkedIn enseñan una miniatura diminuta en vez
       de la tarjeta grande con imagen. -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Jesús Seiler | Sistemas de gestión, desarrollo y sitios web">
  <meta name="twitter:description" content="Auditor interno ISO y desarrollador. Sistemas de gestión multinorma, automatización y sitios web. Puerto Montt, Chile.">

  <!-- ----------------------- FICHA EN JSON-LD -----------------------
       Es lo que permite que un buscador lea la organización como DATOS
       —nombre, web, logo— y no como un párrafo suelto. De aquí sale el panel
       lateral de Google y la ficha de varios agregadores.

       Va ESTÁTICO en el HTML a propósito: generado con JavaScript, los
       rastreadores que no ejecutan scripts no verían nada.

       Es la única copia de estos datos fuera de src/data/site.js, así que
       `npm run check` compara nombre, URL y descripción, y falla si se
       desincronizan. Si el sitio es de una PERSONA y no de una empresa,
       cambia "@type" a "Person"; si tiene local con dirección y horario,
       "LocalBusiness" y añade address y openingHours. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Jesús Seiler",
    "description": "Auditor interno ISO y desarrollador. Sistemas de gestión multinorma, automatización y sitios web. Puerto Montt, Chile.",
    "url": "https://seiler18.github.io/"
  }
  </script>

  <!-- Tipografía. `display=swap` enseña el texto con la fuente del sistema
       mientras la real carga, en vez de dejar un hueco en blanco.

       LOS PESOS QUE PIDES AQUÍ SON LOS QUE PUEDES USAR EN EL CSS. Si una
       regla usa `font-weight: 600` y el 600 no está en esta URL, el navegador
       NO falla: FABRICA el peso engordando el trazo del 400 —la «falsa
       negrita»— y el resultado es un texto sucio que se lee como plantilla
       barata aunque todo lo demás esté bien. Si añades un peso al CSS,
       añádelo también aquí. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">

  <!-- Iconos (Font Awesome 6). Es la versión de referencia para elegir
       clases: `fa-solid fa-x`, `fa-brands fa-x`.

       `integrity` no es decoración: si el CDN devolviera un archivo distinto
       al firmado aquí, el navegador lo descarta en vez de aplicarlo. Es la
       única defensa real que tiene un sitio estático ante un CDN
       comprometido, y `npm run check` falla si añades un recurso externo sin
       ella. Para recalcularla al cambiar de versión:
         curl -s <url> | openssl dgst -sha384 -binary | openssl base64 -A -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
  <script type="module" crossorigin src="/assets/index-D0Kk4WaQ.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-DX6V5tMR.css">
</head>
